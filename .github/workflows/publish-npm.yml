name: Publish CLI

on:
  push:
    tags:
      - 'cli-v*.*.*'

jobs:
  publish:
    name: Publish superslate CLI to npm
    if: github.repository == 'superslate-dev/superslate-cli'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'

      - name: Setup Node for npm registry
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '26.12.1'
          registry-url: https://registry.npmjs.org

      - name: Require an npm CLI with trusted-publishing support
        run: npm install -g npm@12.2.1

      - name: Install build dependencies
        run: bun install --frozen-lockfile

      - name: Require the package version to match the mirror tag
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          tag="${GITHUB_REF_NAME}"
          if [[ "cli-v$version" != "$tag" ]]; then
            echo "package.json version $version does not match tag $tag" >&2
            exit 1
          fi

      - name: Skip already-published versions
        id: guard
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          if npm view "superslate@$version" version >/dev/null 2>&1; then
            echo "superslate@$version is already on npm; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish via trusted publishing with provenance
        if: steps.guard.outputs.skip != 'true'
        run: npm publish

      - name: Verify the published attestation
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          url="https://registry.npmjs.org/-/npm/v1/attestations/superslate@$version"
          for attempt in $(seq 1 10); do
            if curl -sfL "$url" >/dev/null; then
              echo "Attestation published for superslate@$version."
              exit 0
            fi
            echo "Attestation not visible yet (attempt $attempt); retrying."
            sleep 15
          done
          echo "No provenance attestation for superslate@$version after 10 attempts." >&2
          exit 1
